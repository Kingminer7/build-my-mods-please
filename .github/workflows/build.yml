name: Build Geode Mod

on:
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        repo:
          - rewards-in-pause
          - audiooffsetcalculator
          - cosmic-clones
          - soggybasement
          - icon-search
          - platformerjoystick
          - gdps-hub-mod
        target:
          - win
          - macm1
          - macintel
          - ios
          - android32
          - android64

    name: Build ${{ matrix.target }} (${{ matrix.repo }})
    runs-on: ubuntu-latest

    steps:
      - name: Check out the mod
        run: git clone https://codeberg.org/km7dev/${{ matrix.repo}}

      - uses: kingminer7/build-geode-mod-docker@main
        with:
          target: ${{ matrix.target }}
          build-config: ${{ matrix.target == 'win' && 'RelWithDebInfo' || 'Debug' }}
          export-debug: true
          upload: true
          upload-suffix: ${{matrix.repo}}-
          path: ${{ matrix.repo }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        repo:
          - rewards-in-pause
          - audiooffsetcalculator
    steps:
      - uses: kingminer7/build-geode-mod-docker/merge@main
        with:
          upload: true
          upload-suffix: ${{matrix.repo}}-
          output-name: ${{matrix.repo}}

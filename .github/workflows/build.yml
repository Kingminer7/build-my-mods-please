name: Build Geode Mod

on:
  workflow_dispatch:
    inputs:
      mods:
        description: 'What to build'
        type: string
      build_type:
        description: 'Build Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - release
          - debug
  push:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - repo: audiooffsetcalculator
            sn: aoc
          - repo: cosmic-clones
            sn: cc
          - repo: soggybasement
            sn: sb
          - repo: icon-search
            sn: is
          - repo: platformerjoystick
            sn: pj
          - repo: gdps-hub-mod
            sn: gh
        target:
          - win
          - macm1
          - macintel
          - ios
          - android32
          - android64

    name: Build ${{ matrix.target }} (${{ matrix.config.repo }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mod
        if: >
          github.event_name == 'push' && (contains(github.event.head_commit.message, 'all') || contains(github.event.head_commit.message, matrix.config.sn)) ||
          contains(inputs.mods, 'all') || contains(inputs.mods, matrix.config.sn)
        run: git clone https://codeberg.org/km7dev/${{ matrix.config.repo}}

      - uses: kingminer7/build-geode-mod-docker@main
        if: >
          github.event_name == 'push' && (contains(github.event.head_commit.message, 'all') || contains(github.event.head_commit.message, matrix.config.sn)) ||
          contains(inputs.mods, 'all') || contains(inputs.mods, matrix.config.sn)
        with:
          target: ${{ matrix.target }}
          build-config: ${{ matrix.target == 'win' && 'RelWithDebInfo' || 'Debug' }}
          export-debug: true
          upload: true
          upload-suffix: ${{matrix.config.repo}}-
          path: ${{ matrix.config.repo }}

  merge:
    name: Merge
    runs-on: ubuntu-latest
    needs: ['build']
    strategy:
      fail-fast: false
      matrix:
        config:
          - repo: audiooffsetcalculator
            sn: aoc
          - repo: cosmic-clones
            sn: cc
          - repo: soggybasement
            sn: sb
          - repo: icon-search
            sn: is
          - repo: platformerjoystick
            sn: pj
          - repo: gdps-hub-mod
            sn: gh
    steps:
      - uses: kingminer7/build-geode-mod-docker/merge@main
        if: >
          github.event_name == 'push' && (contains(github.event.head_commit.message, 'all') || contains(github.event.head_commit.message, matrix.config.sn)) ||
          contains(inputs.mods, 'all') || contains(inputs.mods, matrix.config.sn)
        with:
          upload: true
          upload-suffix: ${{matrix.config.repo}}-
          output-name: ${{matrix.config.repo}}
